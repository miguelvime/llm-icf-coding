services:
  n8n:
    image: n8nio/n8n@sha256:a49bc161141d6c4b9c495b5a6e3c7c1932e61d2ed2fe3fdca01262064b4b23ca
    container_name: n8n-main
    environment:
      - N8N_RUNNERS_MODE=internal
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_PYTHON_ALLOWED_MODULES=random,math,json,datetime
      - WEBHOOK_URL=http://localhost:5679/
      - N8N_EDITOR_BASE_URL=http://localhost:5679/
    ports:
      - "5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../results:/home/node/results
      - ../data:/home/node/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  analysis:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    user: "1000:1000"
    volumes:
      - ..:/workspace

volumes:
  n8n_data:
